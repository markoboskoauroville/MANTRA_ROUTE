name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release for this version"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: v
        run: |
          V=$(grep '^mantraVersion=' gradle.properties | cut -d= -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building v$V"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # No gradle-wrapper.jar is committed, so Gradle is provisioned here instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The keystore never touches the repository. It arrives as a secret, is written to a
      # path outside the tree, and is shredded at the end of the job.
      - name: Restore the keystore
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "no keystore secret — release will be unsigned"
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mantra_route.jks"
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "keystore restored ($(stat -c%s "$RUNNER_TEMP/mantra_route.jks") bytes)"
          fi

      # TEST 1. The pure logic, no device, no emulator. If this is red nothing else matters.
      - name: Test 1 — the mechanism, alone
        run: gradle :app:testDebugUnitTest --no-daemon

      # modules/app-icon.md §3: arithmetic, not opinion.
      - name: Icon geometry
        run: python3 tools/icon_check.py

      - name: Assemble
        env:
          MANTRA_KEYSTORE: ${{ steps.ks.outputs.have == 'true' && format('{0}/mantra_route.jks', runner.temp) || '' }}
          MANTRA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MANTRA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MANTRA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.ks.outputs.have }}" = "true" ]; then
            gradle :app:assembleRelease --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Confirm it is signed, and by the same key as last time
        run: |
          FILE=$(find app/build/outputs/apk -name '*.apk' | head -1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$FILE" \
            | grep -i "SHA-256 digest" || echo "UNSIGNED"

      - name: Shred the keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/mantra_route.jks" 2>/dev/null || true

      - name: Name the artefact
        id: apk
        run: |
          FILE=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "Built $FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: mantra-route-v${{ steps.v.outputs.version }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          # modules/versioning.md §5: the tag IS the version. Never `latest`.
          gh release create "v$V" "${{ steps.apk.outputs.path }}" \
            --title "v$V" --notes "Mantra Route v$V" || \
          gh release upload "v$V" "${{ steps.apk.outputs.path }}" --clobber

          # §4: only the last two builds stay. This deletes the third-newest and older.
          # UNTESTED — there has only ever been one release.
          gh release list --limit 50 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+$' | sort -t v -k2 -n -r | tail -n +3 \
            | while read -r OLD; do
                echo "deleting $OLD"
                gh release delete "$OLD" --yes --cleanup-tag
              done
