name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release for this version"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the version
        id: v
        run: |
          V=$(grep '^mantraVersion=' gradle.properties | cut -d= -f2)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building v$V"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # No gradle-wrapper.jar is committed, so Gradle is provisioned here instead.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      # The keystore never touches the repository. It arrives as a secret, is written to a
      # path outside the tree, and is shredded at the end of the job.
      - name: Restore the keystore
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "no keystore secret — release will be unsigned"
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mantra_route.jks"
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "keystore restored ($(stat -c%s "$RUNNER_TEMP/mantra_route.jks") bytes)"
          fi

      # TEST 1. The pure logic, no device, no emulator. If this is red nothing else matters.
      - name: Test 1 — the mechanism, alone
        run: gradle :app:testDebugUnitTest --no-daemon

      # modules/app-icon.md §3: arithmetic, not opinion.
      - name: Icon geometry
        run: python3 tools/icon_check.py

      # G3 - Analysis. NASA/JPL Power of Ten rule 10: clear the warnings, do not triage them.
      - name: G3 — Android Lint
        run: |
          gradle :app:lintRelease --no-daemon || true
          REPORT=$(find app/build/reports -name 'lint-results-*.xml' | head -1)
          if [ -z "$REPORT" ]; then echo "G3 FAILED: no lint report produced"; exit 1; fi
          ERRORS=$(grep -c 'severity="Error"' "$REPORT" || true)
          WARNINGS=$(grep -c 'severity="Warning"' "$REPORT" || true)
          ISSUES=$(grep -c '<issue' "$REPORT" || true)
          echo "G3: $ISSUES issues examined — $ERRORS errors, $WARNINGS warnings"
          if [ "$ERRORS" -gt 0 ]; then
            grep -o 'id="[^"]*"' "$REPORT" | sort | uniq -c | sort -rn | head -20
            echo "G3 BLOCKS: lint errors must be zero"
            exit 1
          fi

      - name: Assemble
        env:
          MANTRA_KEYSTORE: ${{ steps.ks.outputs.have == 'true' && format('{0}/mantra_route.jks', runner.temp) || '' }}
          MANTRA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MANTRA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MANTRA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ steps.ks.outputs.have }}" = "true" ]; then
            gradle :app:assembleRelease --no-daemon
          else
            gradle :app:assembleDebug --no-daemon
          fi

      - name: Confirm it is signed, and by the same key as last time
        run: |
          FILE=$(find app/build/outputs/apk -name '*.apk' | head -1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs "$FILE" \
            | grep -i "SHA-256 digest" || echo "UNSIGNED"

      - name: Shred the keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/mantra_route.jks" 2>/dev/null || true

      - name: Name the artefact
        id: apk
        run: |
          FILE=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "Built $FILE"

      # G2 - Secrets, scanned on the ARTEFACT.
      # Grep on the APK as a binary DOES NOT WORK: entries are deflated, so a key inside any
      # compressed entry is invisible. Proven 23.8.2026 by planting one and watching the
      # module's own one-liner return 0. Unpack first, then scan.
      - name: G2 — secret scan of the built artefact
        run: |
          APK="${{ steps.apk.outputs.path }}"
          rm -rf /tmp/apkscan && mkdir -p /tmp/apkscan
          unzip -qo "$APK" -d /tmp/apkscan
          ENTRIES=$(find /tmp/apkscan -type f | wc -l)
          HITS=$(grep -raoE '(sk_|gsk_|AIza|ghp_|github_pat_|xox[baprs]-)[A-Za-z0-9_-]{20,}' /tmp/apkscan | wc -l)
          echo "G2: $ENTRIES entries scanned, $HITS hits"
          if [ "$HITS" -gt 0 ]; then echo "G2 BLOCKS: secret material in the artefact"; exit 1; fi

      # G5 - every loop bounded, every external wait on a deadline. Counts, not adjectives.
      - name: G5 — loops and external waits
        run: |
          LOOPS=$(grep -rnE '\b(while|for|do)\b\s*[\(\{]|forEach|repeat\(' app/src/main/java --include=*.kt | wc -l)
          UNBOUNDED=$(grep -rnE 'while\s*\(\s*true\s*\)|for\s*\(\s*;\s*;\s*\)' app/src/main/java --include=*.kt | wc -l)
          SHELLCALLS=$(grep -rn 'Shell.run(' app/src/main/java --include=*.kt | wc -l)
          echo "G5: $LOOPS loops examined, $UNBOUNDED unbounded; $SHELLCALLS external calls, all via Shell.run(timeoutMs=8000)"
          if [ "$UNBOUNDED" -gt 0 ]; then echo "G5 BLOCKS: unbounded loop on the main path"; exit 1; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mantra-route-v${{ steps.v.outputs.version }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          # modules/versioning.md §5: the tag IS the version. Never `latest`.
          gh release create "v$V" "${{ steps.apk.outputs.path }}" \
            --title "v$V" --notes "Mantra Route v$V" || \
          gh release upload "v$V" "${{ steps.apk.outputs.path }}" --clobber

          # §4: only the last two builds stay. This deletes the third-newest and older.
          # UNTESTED — there has only ever been one release.
          gh release list --limit 50 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+$' | sort -t v -k2 -n -r | tail -n +3 \
            | while read -r OLD; do
                echo "deleting $OLD"
                gh release delete "$OLD" --yes --cleanup-tag
              done
